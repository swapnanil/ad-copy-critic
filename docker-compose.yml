services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  cli:
    build: .
    env_file:
      - .env
    entrypoint: ["python", "main.py"]
    profiles:
      - cli
    volumes:
      - ./examples:/app/examples
      - ./reports:/app/reports
